name: Terraform Validation Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform-validation.yml'

permissions:
  contents: read

concurrency:
  group: terraform-static-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_ROOT: infrastructure/terraform/environments/azure-production

jobs:
  terraform:
    name: Terraform Static Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Terraform format check
        run: terraform -chdir=${TF_ROOT} fmt -check -recursive

      - name: Terraform init without backend
        run: terraform -chdir=${TF_ROOT} init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=${TF_ROOT} validate
