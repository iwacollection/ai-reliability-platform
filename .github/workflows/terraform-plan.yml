name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform-*.yml'
      - '.github/workflows/reusable-terraform.yml'

permissions:
  contents: read
  id-token: write

jobs:
  azure-production-plan:
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      working-directory: infrastructure/terraform/environments/azure-production
      operation: plan
      environment: production-plan
