name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      commit-sha:
        description: Full commit SHA from current main to plan and apply
        required: true
        type: string
      confirm:
        description: Type APPLY to confirm production plan generation
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  confirm:
    name: Confirm production revision
    runs-on: ubuntu-latest
    outputs:
      commit-sha: ${{ steps.guard.outputs.commit_sha }}
      plan-artifact-name: ${{ steps.guard.outputs.plan_artifact_name }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Validate confirmation and revision
        id: guard
        shell: bash
        run: |
          if [ "${{ inputs.confirm }}" != "APPLY" ]; then
            echo "Production workflow requires confirm=APPLY"
            exit 1
          fi

          requested="${{ inputs.commit-sha }}"
          if ! [[ "$requested" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit-sha must be a full 40-character Git commit SHA"
            exit 1
          fi

          git fetch origin main --quiet
          main_sha="$(git rev-parse origin/main)"
          if [ "$requested" != "$main_sha" ]; then
            echo "Requested revision $requested is not current origin/main $main_sha"
            exit 1
          fi

          echo "commit_sha=$requested" >> "$GITHUB_OUTPUT"
          echo "plan_artifact_name=terraform-production-plan-$requested" >> "$GITHUB_OUTPUT"

  plan:
    name: Generate production plan evidence
    needs: confirm
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      working-directory: infrastructure/terraform/environments/azure-production
      operation: plan
      checkout-ref: ${{ needs.confirm.outputs.commit-sha }}
      plan-artifact-name: ${{ needs.confirm.outputs.plan-artifact-name }}

  apply:
    name: Apply approved production plan
    needs:
      - confirm
      - plan
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      working-directory: infrastructure/terraform/environments/azure-production
      operation: apply
      environment: production
      checkout-ref: ${{ needs.confirm.outputs.commit-sha }}
      plan-artifact-name: ${{ needs.confirm.outputs.plan-artifact-name }}
