name: Reusable Terraform

on:
  workflow_call:
    inputs:
      working-directory:
        description: Terraform root module directory
        required: true
        type: string
      operation:
        description: Terraform operation to execute (plan or apply)
        required: true
        type: string
      environment:
        description: GitHub Environment name
        required: false
        default: ""
        type: string
      checkout-ref:
        description: Git ref or commit SHA to validate/apply
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform ${{ inputs.operation }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment != '' && inputs.environment || null }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Validate operation
        shell: bash
        run: |
          case "${{ inputs.operation }}" in
            plan|apply) ;;
            *)
              echo "Unsupported Terraform operation: ${{ inputs.operation }}"
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout-ref != '' && inputs.checkout-ref || github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.0

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Upload Terraform plan
        if: inputs.operation == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: ${{ inputs.working-directory }}/tfplan
          retention-days: 7

      - name: Terraform apply reviewed revision
        if: inputs.operation == 'apply'
        run: terraform apply -input=false -auto-approve tfplan
